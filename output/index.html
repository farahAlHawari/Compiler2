<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>
Compiler Project</title>
<style>
body {
  margin: 0;
  padding: 0;
  background-color: #121212;
  color: #e0e0e0;
  font-family: Tahoma , Verdana , sans-serif;
}
header {
  background-color: #1f1f1f;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 5px #00000080;
}
h1 {
  margin: 0;
  color: #ff4081;
  font-size: 24px;
}
a {
  color: #ff80ab;
  text-decoration: none;
  margin-left: 20px;
  font-weight: bold;
  transition: color 0.3s;
}
a:hover {
  color: #fff;
}
main {
  padding: 30px;
  max-width: 1000px;
  margin: 0 auto;
}
.btn {
  display: inline-block;
  padding: 10px 20px;
  border-radius: 5px;
  text-decoration: none;
  cursor: pointer;
  border: none;
  font-size: 14px;
}
.btn-danger {
  background-color: #d32f2f;
  color: white;
}
.btn-primary {
  background-color: #ff4081;
  color: white;
}
input, textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 15px;
  background-color: #2c2c2c;
  border: 1px solid #444;
  color: white;
  border-radius: 4px;
  box-sizing: border-box;
}
</style>
</head>
<body>
<header>
<h1>
My Shop</h1>
<nav>
<a href="/">
Home</a>
<a href="/add">
Add Product</a>
</nav>
</header>
<main>
<h2 style="color: #ff80ab; border-bottom: 1px solid #333; padding-bottom: 10px;">
Product List</h2>
<div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px;">
<div style="background-color: #1e1e1e; border-radius: 8px; padding: 20px; width: 250px; box-shadow: 0 4px 6px  #00000030; display: flex; flex-direction: column;">
<div style="width: 100%; height: 180px; background-color: #333; border-radius: 5px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; color: #777;">
No Image</div>
<h3 style="margin: 0 0 10px 0; color: #fff;">
A</h3>
<p style="color: #ff4081; font-weight: bold; font-size: 18px; margin: 0 0 10px 0;">
$10</p>
<p style="color: #aaa; font-size: 14px; margin-bottom: 20px; flex-grow: 1;">
x</p>
<div style="margin-top: auto; display: flex; gap: 10px;">
<a href="/details/0" style="flex: 1; text-align: center; background: #333; padding: 8px; border-radius: 4px; color: white;">
Details</a>
<form action="/delete/0" method="get" style="flex: 1;">
<button type="submit" class="btn btn-danger" style="width: 100%;">
Delete</button>
</form>
</div>
</div>
<div style="background-color: #1e1e1e; border-radius: 8px; padding: 20px; width: 250px; box-shadow: 0 4px 6px  #00000030; display: flex; flex-direction: column;">
<div style="width: 100%; height: 180px; background-color: #333; border-radius: 5px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; color: #777;">
No Image</div>
<h3 style="margin: 0 0 10px 0; color: #fff;">
B</h3>
<p style="color: #ff4081; font-weight: bold; font-size: 18px; margin: 0 0 10px 0;">
$10</p>
<p style="color: #aaa; font-size: 14px; margin-bottom: 20px; flex-grow: 1;">
x</p>
<div style="margin-top: auto; display: flex; gap: 10px;">
<a href="/details/1" style="flex: 1; text-align: center; background: #333; padding: 8px; border-radius: 4px; color: white;">
Details</a>
<form action="/delete/1" method="get" style="flex: 1;">
<button type="submit" class="btn btn-danger" style="width: 100%;">
Delete</button>
</form>
</div>
</div>
</div>
</main>
</body>
</html>
